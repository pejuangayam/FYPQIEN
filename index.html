<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klinik Pergigian Sofea Taman Tas — Login</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/index.css" />
</head>

<body class="auth">

  <div class="login-container">
    <div class="login-card">
      <div class="brand-icon">
        <img src="assets/images/icon.jpg" alt="" width="120px" height="90px">
      </div>
      <h4>Klinik Pergigian Sofea Taman Tas</h4>
      <p class="subtitle">Scheduling &amp; Reminders System</p>

      <form id="loginForm">
        <!-- Role Selection -->
        <div class="role-toggle" id="roleGroup">
          <button type="button" class="role-btn active" data-role="admin">
            <i class="bi bi-person-badge"></i> Admin
          </button>
          <button type="button" class="role-btn" data-role="dentist">
            <i class="bi bi-person-heart"></i> Dentist
          </button>
        </div>

        <div class="mb-3">
          <label class="form-label" for="usernameInput">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="usernameInput" placeholder="Enter username" required
              value="Admin">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="passwordInput">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="passwordInput" placeholder="Enter password" required
              value="password123">
          </div>
        </div>

        <button type="submit" class="btn btn-login">
          Sign In <i class="bi bi-arrow-right ms-2"></i>
        </button>
      </form>

      <div class="footer-note">
        <span class="badge bg-light text-dark border me-1">KPSTS</span> Internal Only
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      //Retrieve saved role from sessionStorage default to 'admin' if none exists
      let selectedRole = sessionStorage.getItem('selectedRole') || 'admin';

      // Role toggle logic
      const roleBtns = document.querySelectorAll('.role-btn');
      const usernameInput = document.getElementById('usernameInput');

      //Set initial active button and username based on saved session state
      roleBtns.forEach(b => {
        if (b.getAttribute('data-role') === selectedRole) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });

      if (selectedRole === 'admin') {
        usernameInput.value = 'Admin';
      } else {
        usernameInput.value = 'DrZar';
      }

      roleBtns.forEach(btn => {
        btn.addEventListener('click', function () {
          // Update active state
          roleBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');

          // Update selected role
          selectedRole = this.getAttribute('data-role');

          //Save choice to session storage so it persists on refresh
          sessionStorage.setItem('selectedRole', selectedRole);

          // Autofill mock credentials based on role
          if (selectedRole === 'admin') {
            usernameInput.value = 'Admin';
          } else {
            usernameInput.value = 'DrZar';
          }
        });
      });

      // Form submission logic
      const loginForm = document.getElementById('loginForm');
      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const username = usernameInput.value;
        const password = document.getElementById('passwordInput').value;

        if (username && password) {
          if (selectedRole === 'admin') {
            Clinic.app.setRole('admin');
            window.location.href = 'front-desk.html';
          } else if (selectedRole === 'dentist') {
            Clinic.app.setRole('dentist');
            window.location.href = 'dentist.html';
          }
        }
      });
    });
  </script>
</body>

</html>
