<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klinik Pergigian Sofea Taman Tas — Past Records</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body class="h-screen flex flex-col overflow-hidden text-slate-800 bg-slate-50">

  <div class="flex items-stretch shrink-0 z-20 shadow-sm bg-white">
    <div id="hamburger-container"
      class="w-14 bg-slate-900 border-b border-transparent flex items-center justify-center shrink-0 transition-colors duration-300">
      <button id="hamburger-btn" onclick="toggleSidebar()" class="text-slate-400 hover:text-white transition p-2"><i
          class="fa-solid fa-bars text-lg"></i></button>
    </div>
    <header class="flex-1 border-b border-slate-200 flex items-stretch justify-between">
      <div class="flex items-center space-x-3 px-4 py-2">
        <h1 class="font-semibold text-slate-800 text-base">Klinik Pergigian Sofea Taman Tas</h1>
      </div>
    </header>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar"
      class="w-14 bg-slate-900 text-slate-400 flex flex-col items-center py-3 space-y-4 shrink-0 z-10 transition-all duration-300 ease-in-out">
      <a href="home-dentist.html" class="p-2.5 hover:bg-slate-800 hover:text-white rounded-lg transition"
        title="Home"><i class="fa-solid fa-house text-sm"></i></a>
      <a href="dentist.html"
        class="p-2.5 hover:bg-slate-800 hover:text-white rounded-lg transition flex items-center justify-center text-slate-400"
        title="Calendar"><i class="fa-solid fa-calendar-days text-sm"></i></a>
      <a href="past-records.html"
        class="p-2.5 bg-blue-600 text-white rounded-lg shadow-md flex items-center justify-center" title="History"><i
          class="fa-solid fa-clock-rotate-left text-sm"></i></a>
      <div class="flex-1"></div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden bg-slate-50 relative">

      <!-- Hidden access denied block -->
      <section class="access-denied hidden absolute inset-0 flex flex-col items-center justify-center bg-white z-50"
        id="accessDenied">
        <div class="text-center">
          <i class="bi bi-shield-lock text-danger" style="font-size: 3rem;"></i>
          <h2 class="mt-3">Access Denied</h2>
          <p class="text-muted">You do not have permission to view this page with your current role.</p>
          <button class="btn btn-dark mt-2" id="backToIndex">Return to login</button>
        </div>
      </section>

      <section class="flex flex-col h-full" id="dentistView">
        <div class="bg-white px-6 py-4 border-b border-slate-200 flex justify-between items-center shrink-0">
          <div>
            <h2 class="text-lg font-bold text-slate-800">Past Records</h2>
            <p class="text-xs text-slate-500 mt-1">View history of completed or cancelled treatments.</p>
          </div>
        </div>

        <!-- Records Container -->
        <div class="p-6 flex-1 overflow-auto bg-slate-50">
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">

            <!-- Toolbar -->
            <div
              class="p-4 border-b border-slate-200 bg-white flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                  <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" placeholder="Search patient name, phone, or treatment..." id="searchInput"
                  class="w-full bg-slate-50 text-sm pl-10 pr-4 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
              </div>
              <div class="flex items-center space-x-3">
                <select
                  class="bg-slate-50 border border-slate-200 text-slate-600 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 transition"
                  id="statusFilter">
                  <option value="all">All Status</option>
                  <option value="completed">Completed</option>
                  <option value="cancelled">Cancelled</option>
                </select>
                <input type="date"
                  class="bg-slate-50 border border-slate-200 text-slate-600 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 transition"
                  id="dateFilter">
              </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr
                    class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500 font-bold">
                    <th class="px-6 py-3">Date</th>
                    <th class="px-6 py-3">Time</th>
                    <th class="px-6 py-3">Patient Details</th>
                    <th class="px-6 py-3">Treatment</th>
                    <th class="px-6 py-3">Notes</th>
                    <th class="px-6 py-3 text-right">Status</th>
                  </tr>
                </thead>
                <tbody id="recordsTableBody" class="divide-y divide-slate-100">
                  <!-- Mock Data generated by script -->
                </tbody>
              </table>
            </div>

          </div>
        </div>

      </section>
    </main>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Mock past records data
      const mockRecords = [
        { date: '2023-10-24', time: '09:00 AM', name: 'Ahmad bin Abu', phone: '012-345 6789', treatment: 'Scaling', notes: 'Routine checkup, mild plaque', status: 'completed' },
        { date: '2023-10-24', time: '10:30 AM', name: 'Siti Nurhaliza', phone: '019-876 5432', treatment: 'Braces Adjustment', notes: 'Changed power chain to blue', status: 'completed' },
        { date: '2023-10-23', time: '02:00 PM', name: 'Chong Wei', phone: '016-111 2222', treatment: 'Extraction', notes: 'Upper left wisdom tooth', status: 'completed' },
        { date: '2023-10-23', time: '04:00 PM', name: 'Muthu Kumar', phone: '017-333 4444', treatment: 'Scaling', notes: 'Patient no-show', status: 'cancelled' },
        { date: '2023-10-20', time: '11:00 AM', name: 'Nur Aisyah', phone: '013-555 6666', treatment: 'Braces Adjustment', notes: 'Requested delay by 1 week', status: 'cancelled' },
        { date: '2023-10-18', time: '03:30 PM', name: 'Farid Kamil', phone: '018-999 0000', treatment: 'Filling', notes: 'Composite filling lower right', status: 'completed' }
      ];

      const tbody = document.getElementById('recordsTableBody');

      function renderRecords(records) {
        tbody.innerHTML = '';
        records.forEach(rec => {
          const statusBadge = rec.status === 'completed'
            ? '<span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-[10px] font-bold shadow-sm inline-flex items-center gap-1.5"><i class="fa-solid fa-circle-check"></i> COMPLETED</span>'
            : '<span class="bg-rose-100 text-rose-800 px-2.5 py-1 rounded-full text-[10px] font-bold shadow-sm inline-flex items-center gap-1.5"><i class="fa-solid fa-circle-xmark"></i> CANCELLED</span>';

          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50/50 transition cursor-default';
          tr.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap text-xs font-bold text-slate-700">${rec.date}</td>
            <td class="px-6 py-4 whitespace-nowrap text-xs text-slate-500 font-medium">${rec.time}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-xs font-bold text-slate-800 uppercase tracking-wide">${rec.name}</div>
              <div class="text-[11px] text-slate-500 mt-0.5"><i class="fa-solid fa-phone text-[9px] mr-1"></i>${rec.phone}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="text-xs font-bold text-slate-700">${rec.treatment}</span>
            </td>
            <td class="px-6 py-4 text-xs text-slate-500 max-w-[200px] truncate" title="${rec.notes || '-'}">
              ${rec.notes || '-'}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right">
              ${statusBadge}
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      renderRecords(mockRecords);

      // Centralized filter function
      function applyFilters() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const statusVal = document.getElementById('statusFilter').value;
        const dateVal = document.getElementById('dateFilter').value; // 'YYYY-MM-DD'

        const filtered = mockRecords.filter(r => {
          const matchQuery = r.name.toLowerCase().includes(query) ||
            r.phone.includes(query) ||
            r.treatment.toLowerCase().includes(query);
          const matchStatus = statusVal === 'all' || r.status === statusVal;
          const matchDate = !dateVal || r.date === dateVal;

          return matchQuery && matchStatus && matchDate;
        });

        renderRecords(filtered);
      }

      document.getElementById('searchInput').addEventListener('input', applyFilters);
      document.getElementById('statusFilter').addEventListener('change', applyFilters);
      document.getElementById('dateFilter').addEventListener('change', applyFilters);

      // Simple auth check similar to dentist.js
      if (Clinic.app && Clinic.app.getCurrentRole) {
        const role = Clinic.app.getCurrentRole();
        if (role !== 'dentist' && role !== 'admin') {
          document.getElementById('dentistView').classList.add('hidden');
          document.getElementById('accessDenied').classList.remove('hidden');
        }
      }
    });

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const hamburgerContainer = document.getElementById('hamburger-container');
      const hamburgerBtn = document.getElementById('hamburger-btn');

      if (sidebar) {
        sidebar.classList.toggle('-ml-14');
        sidebar.classList.toggle('opacity-0');

        if (hamburgerContainer && hamburgerBtn) {
          hamburgerContainer.classList.toggle('bg-slate-900');
          hamburgerContainer.classList.toggle('bg-white');
          hamburgerContainer.classList.toggle('border-transparent');
          hamburgerContainer.classList.toggle('border-slate-200');

          hamburgerBtn.classList.toggle('text-slate-400');
          hamburgerBtn.classList.toggle('hover:text-white');

          hamburgerBtn.classList.toggle('text-slate-600');
          hamburgerBtn.classList.toggle('hover:text-slate-900');
        }
      }
    }
  </script>
</body>

</html>
